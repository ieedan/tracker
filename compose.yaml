# Infrastructure only — the app itself runs on the host under `bizi run dev`.
# Everything here is state: Postgres for the database, MinIO for uploads.
#
# Both services are long-running, deliberately: `docker compose up --wait` treats
# a container that exits as a failure, so a one-shot bucket-creation container
# would fail the command every time. The app creates and opens the bucket itself
# on startup instead — see `init` in src/hooks.server.ts.

name: tracker

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ wants the mount one level up, at /var/lib/postgresql, so the
      # image can keep major-version-specific subdirectories for pg_upgrade.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # `pg_isready` alone reports ready while the init scripts are still running,
      # so the check also asks the database to answer a query.
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker -q && psql -U tracker -d tracker -c 'select 1' -q"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tracker
      MINIO_ROOT_PASSWORD: trackertracker
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  minio-data:
